name: Unit Tests + Publish Maven Central

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 8
          cache: maven

      - name: Compile FUA
        run: mvn -B clean package -DskipTests

      - name: Run API and controller tests
        run: mvn -B verify

      - name: Test backend smoke preparation
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Upload Jacoco coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: api-jacoco-report
          path: api/target/site/jacoco

  backend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: compile
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Check out FUA
        uses: actions/checkout@v4
        with:
          path: fua

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 8
          cache: maven

      - name: Package FUA candidate
        working-directory: fua
        run: mvn -B clean package -DskipTests

      - name: Check out SIHSALUS backend
        uses: actions/checkout@v4
        with:
          repository: sihsalus/sihsalus
          path: sihsalus

      - name: Point backend to this FUA build
        run: |
          set -euo pipefail
          set -- fua/omod/target/fua-*.omod
          [ "$#" -eq 1 ] && [ -f "$1" ]
          python3 fua/.github/scripts/prepare-backend-smoke.py --backend sihsalus --module "$1"
          git -C sihsalus rev-parse HEAD

      - name: Set up JDK 21 for packaged dependency verification
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Inspect Docker runtime
        run: |
          docker context show
          docker info

      - uses: docker/setup-buildx-action@v3

      - name: Build backend with PR FUA
        uses: docker/build-push-action@v6
        with:
          context: sihsalus
          file: sihsalus/backend/Dockerfile
          load: true
          push: false
          tags: sihsalus-backend:fua-smoke
          build-args: SECURITY_REFRESH=${{ github.sha }}
          cache-from: type=gha,scope=fua-backend-smoke
          cache-to: type=gha,scope=fua-backend-smoke,mode=max

      - name: Verify packaged FUA bytes
        run: |
          set -euo pipefail
          container_id=$(docker create --network none --entrypoint /bin/true sihsalus-backend:fua-smoke)
          trap 'docker rm --volumes "$container_id" >/dev/null' EXIT
          mkdir packaged-modules
          docker cp "$container_id:/openmrs/distribution/openmrs_modules/." packaged-modules/
          set -- packaged-modules/fua-*.omod
          [ "$#" -eq 1 ] && [ -f "$1" ]
          cmp sihsalus/backend/fua-smoke.omod "$1"
          sha256sum "$1"

      - name: Verify module dependencies against packaged Core
        working-directory: sihsalus
        run: bash tests/backend/module-dependencies-image.sh sihsalus-backend:fua-smoke

  publish:
    runs-on: ubuntu-latest
    needs: compile
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 8
          cache: maven

      - name: Check associated merged PR
        id: merged-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_COUNT=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null)] | length')
          if [ "$PR_COUNT" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Commit is associated with a merged pull request."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Commit is not associated with a merged pull request; skipping publish."
          fi

      - name: Set up Maven Central credentials
        if: steps.merged-pr.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 8
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Check Maven Central version
        id: central-version
        if: steps.merged-pr.outputs.exists == 'true'
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          URL="https://repo1.maven.org/maven2/io/github/proyecto-santaclotilde/fua-omod/${VERSION}/fua-omod-${VERSION}.pom"
          if curl -fsI "$URL" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already exists in Maven Central; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is not in Maven Central; publishing."
          fi

      - name: Publish to Maven Central
        if: >-
          steps.merged-pr.outputs.exists == 'true' &&
          steps.central-version.outputs.exists == 'false'
        run: mvn -B -P release deploy -DskipTests
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
